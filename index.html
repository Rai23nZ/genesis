<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Семейное древо</title>
<link rel="stylesheet" href="./styles.css">
<script src="./config.js"></script>
<!-- Зависимости лежат локально: их кладёт server/host/vendor.sh, проверяя те же
     хэши SHA-384, что стоят здесь. Ни один посетитель архива не обращается за
     ними на сторонний CDN, а CSP на сервере разрешает только «свой домен». -->
<script src="./vendor/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
<script src="./vendor/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
<script src="./vendor/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"></script>
<script src="./vendor/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67"></script>
<style>
  /* Шрифты и веса задаёт styles.css — единственный источник правды по виду.
     Раньше здесь стоял свой :root с теми же переменными; он шёл после
     styles.css и молча перебивал дизайн-систему, из-за чего часть токенов
     не действовала вовсе. */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-surface); }
  body, #root { height: 100vh; overflow: hidden; }
  a { color: var(--color-accent); text-decoration: none; }
  a:hover { color: var(--color-accent-700); text-decoration: underline; }
  input, textarea, select, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #201e1d22; }
  [data-print-layer] { display: none; }
  @media print {
    html, body { background: #fff !important; }
    body[data-printing] { overflow: visible !important; height: auto !important; }
    body[data-printing] #root { display: none !important; }
    body[data-printing] [data-print-layer] { display: block !important; }
    body[data-printing] .om-sheet { break-after: page; page-break-after: always; }
    body[data-printing] .om-sheet:last-child { break-after: auto; page-break-after: auto; }
    @page { margin: 8mm; }
  }
</style>
</head>
<body>
<div id="root"></div>
<!-- Компонент карты регистрирует элемент <family-map>, который использует app.js.
     Без этой строки на месте карты пустой блок: неизвестный тег браузер рисует
     как пустой div, молча и без ошибок. -->
<script src="./world-map.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
